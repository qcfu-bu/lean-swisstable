name = "swisstable"
version = "0.1.0"
defaultTargets = ["SwissTable"]
# `lake test` builds this library: "A library will just be built" (Lake's PackageConfig doc).
testDriver = "SwissTableTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The library: every module reachable from SwissTable.lean (with the Swiss core selected by
# SwissTable/Core/Table.lean, that is all of SwissTable/ except the reference core
# SwissTable/Core/ListRef.lean, which the test library checks against the contract).
[[lean_lib]]
name = "SwissTable"

# The statement-parity checker (imports only Lean).
[[lean_lib]]
name = "Parity"
srcDir = "test"
roots = ["Parity"]

# Conformance, seal, axiom, parity, cbv and #guard tests (run by `lake test`). The second and
# third roots check the reference core SwissTable.Core.ListRef against the contract and audit its
# axioms; they are separate roots because ListRef and the selected core define the same names and
# cannot be imported together.
[[lean_lib]]
name = "SwissTableTest"
srcDir = "test"
roots = ["SwissTableTest", "SwissTableTest.CoreSpecListRef", "SwissTableTest.AuditListRef"]

# The benchmark (bench/Main.lean, `lake exe swisstable-bench`): the bake-off harness's workloads for
# SwissTable.HashMap and Std.HashMap, compiled with the harness's flags. Not built by `lake build`.
[[lean_lib]]
name = "Bench"
srcDir = "bench"
roots = ["Bench", "Bench.CCheck"]
moreLeancArgs = ["-O3", "-march=native", "-fno-plt", "-flto"]

[[lean_exe]]
name = "swisstable-bench"
srcDir = "bench"
root = "Main"
moreLeancArgs = ["-O3", "-march=native", "-fno-plt", "-flto"]
moreLinkArgs = ["-flto"]
